<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EOIR API Portal</title>
    <style>
      :root {
        color-scheme: light dark;
        --font-main: ui-sans-serif, system-ui, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --bg: #fff;
        --text: #444;
        --muted: #787878;
        --border: #444;
        --light-grey: #f3f2f2;
        --blue: #1853bb;
        --light-blue: #4d8aff;
        --bg-error: #f8d7da;
        --text-error: #721c24;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181a1b;
          --text: #e0e0e0;
          --muted: #b0b0b0;
          --border: #e0e0e0;
          --light-grey: #242728;
          --blue: #4d8aff;
          --bg-error: #2d1b1e;
          --text-error: #f5c6cb;
        }
      }

      /* Global */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--font-main);
        line-height: 1.5;
        color: var(--text);
        background: var(--bg);
      }

      a {
        color: var(--blue);
        text-decoration: none;

        &:hover {
          text-decoration: underline;
        }
      }

      h1 {
        margin: 0;
        font-size: 2em;
      }

      h2 {
        margin: 0;
        font-size: 1.5em;
      }

      p {
        margin: 0;
      }

      /* Compositions */

      .container {
        width: 100%;
        max-width: 1000px;
        margin-inline: auto;
        padding-inline: 1.25rem;
      }

      .flow > * + * {
        margin-block-start: var(--flow-space, 1rem);
      }

      .cluster {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--gutter, 0.6em);
      }

      .repel {
        justify-content: space-between;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 0.3em;
      }

      /* Utilities */

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: 0.9em;
      }

      .err {
        color: var(--text-error);
      }

      .justify-end {
        justify-content: flex-end;
      }

      .stretch {
        align-self: stretch;
      }

      .push {
        margin-inline-end: auto;
      }

      /* Blocks */

      .site-nav {
        --gutter: 1em;
        padding-block: 1em 0.6em;
      }

      .site-main {
        --flow-space: 1.5rem;
        padding-block: 1.25rem 2.5rem;
      }

      .site-id {
        --gutter: 0.4em;
      }

      .wordmark {
        color: var(--text);
        font-weight: 700;
      }

      .btn {
        cursor: pointer;
        background: var(--light-grey);
        color: var(--text);
        font: inherit;
        padding: 0.4em 0.8em;
        border: 1px solid var(--border);
      }

      .btn-link {
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--blue);

        &:hover {
          text-decoration: underline;
        }
      }

      .btn-sm {
        padding-block: 0.3em;
      }

      .btn-primary {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }

      .field {
        color: var(--text);
        font: inherit;
        padding: 0.5em;
        border: 1px solid var(--border);
        background: var(--bg);
        outline: none;

        &:focus {
          border-color: var(--light-blue);
          box-shadow: 0 0 0 0.2rem color-mix(in srgb, var(--light-blue) 25%, transparent);
        }
      }

      .field-key {
        width: 100%;
        font-family: var(--font-mono);
      }

      .field-sm {
        padding: 0.3em 0.5em;
      }

      .login {
        max-width: 480px;
      }

      .alert {
        padding: 0.8em;
        background: var(--bg-error);
        color: var(--text-error);
      }

      .lookups {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .lookup {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: 1em;
        align-items: baseline;
        padding-block: 0.55em;
        border-bottom: 1px solid var(--light-grey);
      }

      .lookup-dur {
        grid-row: 1 / span 2;
        grid-column: 2;
        align-self: center;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .figure {
        font-size: 1.5em;
      }

      .meter {
        height: 0.9em;
        border: 1px solid var(--border);
        background: var(--light-grey);

        & span {
          display: block;
          height: 100%;
          background: var(--text);
        }
      }
    </style>
  </head>
  <body>
    <nav class="site-nav container cluster repel">
      <div class="cluster site-id">
        <a class="wordmark" href="/portal">EOIR API</a>
        {% if tenant %}<span class="muted">/ {{ tenant.name }}</span>{% endif %}
      </div>
      {% if tenant %}
        <div class="cluster">
          <a href="/schema">API Docs</a>
          <form method="post" action="/portal/logout">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn-link">End session</button>
          </form>
        </div>
      {% endif %}
    </nav>
    <main class="site-main container flow">
      {% block main %}{% endblock %}
    </main>
  </body>
</html>
