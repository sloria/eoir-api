[project]
name = "acis-core"
version = "1.0.0"
description = "Reference data and utilities shared by ACIS clients."
readme = "README.md"
authors = [{ name = "Steven Loria", email = "git@stevenloria.com" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/sloria/eoir-api"
Source = "https://github.com/sloria/eoir-api"
Issues = "https://github.com/sloria/eoir-api/issues"

[build-system]
requires = ["flit_core<5"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "acis_core"

[tool.ruff]
extend = "../../pyproject.toml"
