[env]
_.file = ".env"

[tools]
uv = "latest"
prek = "latest"

[tasks.setup]
description = "Set up the development environment"
run = """
test -f config.toml || cp config.example.toml config.toml
test -f .env || cp .env.example .env
uv sync --all-packages --all-groups
uv run patchright install chrome
prek install -f
"""

[tasks.lint]
description = "Lint the codebase"
run = "prek run --all-files"

[tasks.typecheck]
description = "Run type checks"
run = "uv run ty check"

[tasks.test]
description = "Run tests (excludes live browser tests)"
run = "uv run pytest"

[tasks."test:live"]
description = "Run live browser tests against the real ACIS site"
run = "uv run pytest -m live"

[tasks.dev]
description = "Run the app server in development mode"
run = "uv run eoir-api serve -c config.toml --reload --debug"

[tasks.start]
description = "Run the production server"
run = "uv run --frozen eoir-api serve -c config.toml"

[tasks."refresh-reference"]
description = "Re-fetch nationality codes and decision types from ACIS"
run = "uv run python packages/acis-browser/scripts/refresh_reference_data.py"
