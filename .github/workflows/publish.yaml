name: Publish package

on:
  push:
    tags:
      - "acis-browser-v*"
      - "acis-core-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Verify tag matches package version
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="${TAG%-v*}"
          tag_version="${TAG##*-v}"
          pkg_version="$(uv version --package "$pkg" --short --frozen)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag version '$tag_version' does not match packages/$pkg version '$pkg_version'" >&2
            exit 1
          fi
          echo "name=$pkg" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        env:
          PKG: ${{ steps.pkg.outputs.name }}
        run: uv build --package "$PKG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
